<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>test2</title>
</head>
<body>
   <div>
      <div>
      <form action="ex02.jsp">
      <div>
         <table border="1">
            <caption style="font-weight: bolder; margin-bottom: 10px;">웹 폼 사례</caption>
               <tbody>
                  <tr>
                     <th>사용자이름</th>
                     <td><input name="name" type="text" placeholder="이름을 입력하세요."></td>
                  </tr>
                  <tr>
                     <th>이메일</th>
                     <td><input name="email" type="email" placeholder="메일주소를 입력하세요."></td>
                  </tr>
                  <tr>
                     <th>검색단어</th>
                     <td><input name="search" type="text" placeholder="갬석어를 입력하세요."></td>
                  </tr>
                  <tr>
                     <th>취미</th>
                     <td style="text-align: center;">
                        <input name="hobby" type="checkbox" value="운동">운동
                        <input name="hobby" type="checkbox" value="악기">악기
                        <input name="hobby" type="checkbox" value="여행">여행
                     </td>
                  </tr>
                  <tr>
                     <th>성별</th>
                     <td style="text-align: center;">
                        <input name="gender" type="radio" value="남자">남자
                        <input name="gender" type="radio" value="여자">여자
                     </td>
                  </tr>
                  <tr>
                     <th>점심메뉴</th>
                     <td style="text-align: center;">
                        <select name="lunch">
                           <option value="짜장면">짜장면</option>
                           <option value="짬뽕">짬 뽕</option>
                           <option value="볶음밥">볶음밥</option>
                        </select>
                     </td>
                  </tr>
               </tbody>
         </table>
         <div style="margin-left: 8em;">
            <input type="submit" value="Submit">
         </div>
         </form>
      </div>
   </div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Insert title here</title>
<style type="text/css">
	header,section,footer,aside,nav,article,figure,figcaption,hgroup{
  		display: block;
  		text-align: center;
  	}
	table{
		border: 1px solid;
		width: 960px;
	}
	td{
		width: 200px;
	}
	header{
		height: 80px;
		margin: 5px;
		padding: 10px;
		background: #cccccc;
		text-align: center;
	}

</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"
	integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
	crossorigin="anonymous"></script>
</head>
<body>
	<header>
		<h1>jQuery Ajax Exercise</h1>
	</header>
	<section>
		<form action="">
			<table>
				<tr><td>
					<select id="type">
						<option value="koreanfood">한식</option>
						<option value="saladbar">셀러드바</option>
					</select>
					</td>
					<td>
					<select id="detail">
						<option value="sodam">소담애</option>
						<option value="babnbool">밥앤불고기</option>
					</select>
					</td>
				</tr>
				<tr><td></td><td></td></tr>
			</table>
		</form>
	</section>
	
	<script type="text/javascript">
		//초기설정
		$(function() {
			//1. type select의 change 이벤트 핸들러를 등록하기
			$('#type').on('change', () => {
				//alert($('#type').val());
				//2. 변경된 type에 따라 detail 내부 옵션을 변경(변경할 데이터는 ajax로 수신함)
				$.ajax({
					url: 'JQServlet',
					'data': { type: $('#type').val() },
					success: function(result) {
						//alert('>>>> ' + result); //[Object object]로 출력됨 -> 그냥 객첸디?
						//alert('>>>> ' + JSON.stringify(result)); //그 객체를 문자열로 표현해주는것
						//3. detail select의 내부를 변경 (삭제 후 생성)
						$('#detail').empty(); //하위삭제
						for(const key in result) {
							//alert(key);
							let myOption = `<option value="${key}">${result[key]}</option>`;
							$('#detail').append(myOption);
						}
					}
				})
			});
		})
	</script>
</body>
</html>
